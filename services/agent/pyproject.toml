[project]
name = "info-agent-agent"
version = "0.1.0"
description = "Info Agent execution kernel"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "pydantic>=2.7,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1,<2",
    "redis>=5,<6",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
