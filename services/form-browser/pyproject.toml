[project]
name = "info-agent-form-browser"
version = "0.1.0"
description = "Stateful browser service for the Agent form-filling capability"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "playwright>=1.49,<2",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
