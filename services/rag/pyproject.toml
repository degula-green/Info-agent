[project]
name = "info-agent-rag"
version = "0.1.0"
description = "Info Agent RAG service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "elasticsearch==9.5.0",
    "fastapi==0.115.6",
    "minio>=7.2,<8",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "redis>=5,<6",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false
