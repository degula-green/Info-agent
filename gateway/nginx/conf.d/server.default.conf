map $http_origin $desktop_cors_origin {
    default "";
    "null" "null";
    "~^file://" $http_origin;
}

server {
    listen 80;
    server_name _;

    # Desktop builds load local file:// content. This HTTP Staging gateway
    # permits those origins; production should move to a secure app:// origin
    # or a dedicated HTTPS domain.
    add_header Access-Control-Allow-Origin $desktop_cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Request-ID,X-Trace-ID,X-Agent-Device-ID,X-Agent-Device-Key,X-Agent-Timestamp,X-Agent-Payload-Hash,X-Agent-Signature" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /invite {
        alias /usr/share/nginx/html/app-links/invite.html;
        add_header Cache-Control "no-store";
    }

    location /api/core/ {
        proxy_pass http://core-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/knowledge/ {
        proxy_pass http://knowledge-service:8090;
        client_max_body_size 110m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/rag/ {
        location ~ ^/api/rag/internal/ {
            return 403;
        }

        proxy_pass http://rag-service:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/agent/ {
        client_max_body_size 25M;
        proxy_pass http://agent-service:8080/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 480s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location / {
        return 404;
    }
}
