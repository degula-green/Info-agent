server {
    listen 80;
    server_name _;

    location /api/core/ {
        proxy_pass http://core-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location = /api/knowledge/health {
        proxy_pass http://knowledge-service:8090/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/knowledge/ {
        # Preserve the public /api/knowledge/v1 prefix. The Knowledge service
        # still exposes /v1 as a local compatibility alias, but the gateway
        # must route the documented prefix directly.
        proxy_pass http://knowledge-service:8090;
        client_max_body_size 110m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/rag/ {
        # 拒绝内部API
        location ~ ^/api/rag/internal/ {
            return 403;
        }

        proxy_pass http://rag-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
    }

    location /api/agent/ {
        client_max_body_size 25M;
        proxy_pass http://agent-service:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Trace-ID $upstream_trace_id;
        proxy_read_timeout 480s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
