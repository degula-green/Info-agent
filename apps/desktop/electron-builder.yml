appId: com.infoagent.desktop
productName: Info Agent
protocols:
  - name: Info Agent OAuth
    schemes:
      - infoagent
directories:
  output: dist
files:
  - src/**
  - package.json
  - desktop.config.example.json
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
