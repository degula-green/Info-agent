services:
  web:
    build: ../apps/web
    expose:
      - "80"

  core-service:
    build: ../services/core
    environment:
      CORE_REDIS_DATABASE: ${CORE_REDIS_DATABASE:-1}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://127.0.0.1:6379/1}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgresql://127.0.0.1:5432/info_agent}
      CORE_DATABASE_SCHEMA: ${CORE_DATABASE_SCHEMA:-public}
      CORE_MINIO_ENDPOINT: ${CORE_MINIO_ENDPOINT:-127.0.0.1:9000}
      CORE_MINIO_ACCESS_KEY: ${CORE_MINIO_ACCESS_KEY:-}
      CORE_MINIO_SECRET_KEY: ${CORE_MINIO_SECRET_KEY:-}
      CORE_MINIO_BUCKET: ${CORE_MINIO_BUCKET:-info-agent}
    expose:
      - "8080"

  knowledge-service:
    build: ../services/knowledge
    expose:
      - "8090"

  rag-service:
    build: ../services/rag
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
    expose:
      - "8000"
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - core-service
      - knowledge-service
      - rag-service

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8081:8080"

volumes:
  elasticsearch-data:
