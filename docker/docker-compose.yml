x-agent-environment: &agent-environment
  AGENT_HTTP_HOST: 0.0.0.0
  AGENT_HTTP_PORT: 8080
  AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
  AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
  AGENT_DATABASE_SCHEMA: ${AGENT_DATABASE_SCHEMA:-agent}
  AGENT_REDIS_URL: ${AGENT_REDIS_URL:-redis://redis:6379/1}
  AGENT_REDIS_INBOUND_STREAM: ${AGENT_REDIS_INBOUND_STREAM:-agent:tasks}
  AGENT_KNOWLEDGE_BASE_URL: ${AGENT_KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
  AGENT_KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_SERVICE_TOKEN:-local-development-only}
  AGENT_KNOWLEDGE_READY_STREAM: ${KNOWLEDGE_REDIS_OUTBOUND_STREAM:-knowledge:ready}
  AGENT_CORE_BASE_URL: ${AGENT_CORE_BASE_URL:-http://core-service:8080}
  AGENT_RAG_BASE_URL: ${AGENT_RAG_BASE_URL:-http://rag-service:8000}
  AGENT_RAG_SERVICE_TOKEN: ${RAG_INTERNAL_TOKEN:-local-development-only}
  AGENT_RAG_AGENT_TOOLS_ENABLED: ${AGENT_RAG_AGENT_TOOLS_ENABLED:-true}
  AGENT_FORM_BROWSER_MODE: ${AGENT_FORM_BROWSER_MODE:-server}
  AGENT_FORM_BROWSER_URL: ${AGENT_FORM_BROWSER_URL:-http://form-browser:8500}
  AGENT_FORM_BROWSER_TOKEN: ${FORM_BROWSER_API_TOKEN:-local-development-only}
  AGENT_DESKTOP_TASK_TTL_SECONDS: ${AGENT_DESKTOP_TASK_TTL_SECONDS:-300}
  AGENT_DESKTOP_TASK_LEASE_SECONDS: ${AGENT_DESKTOP_TASK_LEASE_SECONDS:-60}
  AGENT_DESKTOP_TASK_POLL_SECONDS: ${AGENT_DESKTOP_TASK_POLL_SECONDS:-1}
  AGENT_PLANNER_PROVIDER: ${AGENT_PLANNER_PROVIDER:-routing}
  AGENT_UNDERSTANDING_MODE: ${AGENT_UNDERSTANDING_MODE:-off}
  AGENT_UNDERSTANDING_PROVIDER: ${AGENT_UNDERSTANDING_PROVIDER:-jev}
  AGENT_UNDERSTANDING_PRIMARY: ${AGENT_UNDERSTANDING_PRIMARY:-jev}
  AGENT_JEV_BASE_URL: ${AGENT_JEV_BASE_URL:-https://aihubmix.com/v1}
  AGENT_JEV_API_KEY: ${AGENT_JEV_API_KEY:-}
  AGENT_JEV_MODEL: ${AGENT_JEV_MODEL:-jev-1.13}
  AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
  AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
  AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
  AGENT_SEARXNG_BASE_URL: ${AGENT_SEARXNG_BASE_URL:-http://searxng:8080}
  AGENT_CRAWL4AI_BASE_URL: ${AGENT_CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
  AGENT_CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-local-development-only}
  # Person, weekly-report and multimodal attachment features added on the
  # agent branch. These are defaults; a deployment can override them.
  AGENT_ATTACHMENT_MINIO_BUCKET: ${AGENT_ATTACHMENT_MINIO_BUCKET:-agent-temp}
  AGENT_ATTACHMENT_TTL_HOURS: ${AGENT_ATTACHMENT_TTL_HOURS:-24}
  AGENT_ATTACHMENT_MAX_SIZE_BYTES: ${AGENT_ATTACHMENT_MAX_SIZE_BYTES:-20971520}
  AGENT_MINIO_ENDPOINT: ${AGENT_MINIO_ENDPOINT:-minio:9000}
  AGENT_MINIO_ACCESS_KEY: ${AGENT_MINIO_ACCESS_KEY:-minioadmin}
  AGENT_MINIO_SECRET_KEY: ${AGENT_MINIO_SECRET_KEY:-minioadmin}
  AGENT_PERSON_QUERY_TIMEOUT_SECONDS: ${AGENT_PERSON_QUERY_TIMEOUT_SECONDS:-180}
  AGENT_REPORT_TIMEOUT_SECONDS: ${AGENT_REPORT_TIMEOUT_SECONDS:-180}
  AGENT_REPORT_MAX_OUTPUT_TOKENS: ${AGENT_REPORT_MAX_OUTPUT_TOKENS:-4000}
  AGENT_ANSWER_STREAMING_ENABLED: ${AGENT_ANSWER_STREAMING_ENABLED:-true}

services:
  web:
    build: ../apps/web
    expose:
      - "80"

  core-service:
    build: ../services/core
    environment:
      CORE_REDIS_DATABASE: ${CORE_REDIS_DATABASE:-1}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/1}
      CORE_REFRESH_ROTATION_GRACE: ${CORE_REFRESH_ROTATION_GRACE:-5s}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      CORE_DATABASE_SCHEMA: ${CORE_DATABASE_SCHEMA:-public}
      CORE_MINIO_ENDPOINT: ${CORE_MINIO_ENDPOINT:-minio:9000}
      CORE_MINIO_ACCESS_KEY: ${CORE_MINIO_ACCESS_KEY:-minioadmin}
      CORE_MINIO_SECRET_KEY: ${CORE_MINIO_SECRET_KEY:-minioadmin}
      CORE_MINIO_BUCKET: ${CORE_MINIO_BUCKET:-info-agent}
      CORE_OPENFGA_URL: ${CORE_OPENFGA_URL:-http://openfga:8080}
      CORE_OPENFGA_STORE_ID: ${CORE_OPENFGA_STORE_ID:-}
      CORE_OPENFGA_MODEL_ID: ${CORE_OPENFGA_MODEL_ID:-}
      CORE_RAG_AUTHZ_TOKEN: ${CORE_RAG_AUTHZ_TOKEN:-local-development-only}
      CORE_KNOWLEDGE_AUTHZ_TOKEN: ${KNOWLEDGE_CORE_SERVICE_TOKEN:-local-development-only}
      CORE_KNOWLEDGE_URL: ${CORE_KNOWLEDGE_URL:-http://knowledge-service:8090}
    depends_on:
      - postgres
      - redis
      - minio
      - openfga
    expose:
      - "8080"

  knowledge-service:
    build: ../services/knowledge
    environment:
      KNOWLEDGE_HTTP_PORT: 8090
      KNOWLEDGE_CONTACT_PROFILE_REFRESH_INTERVAL: ${KNOWLEDGE_CONTACT_PROFILE_REFRESH_INTERVAL:-72h}
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      KNOWLEDGE_DATABASE_SCHEMA: ${KNOWLEDGE_DATABASE_SCHEMA:-knowledge}
      KNOWLEDGE_REDIS_URL: ${KNOWLEDGE_REDIS_URL:-redis://redis:6379/1}
      KNOWLEDGE_REDIS_REQUIRED: ${KNOWLEDGE_REDIS_REQUIRED:-true}
      KNOWLEDGE_REDIS_OUTBOUND_STREAM: ${KNOWLEDGE_REDIS_OUTBOUND_STREAM:-knowledge:ready}
      KNOWLEDGE_MINIO_ENDPOINT: ${KNOWLEDGE_MINIO_ENDPOINT:-minio:9000}
      KNOWLEDGE_MINIO_ACCESS_KEY: ${KNOWLEDGE_MINIO_ACCESS_KEY:-minioadmin}
      KNOWLEDGE_MINIO_SECRET_KEY: ${KNOWLEDGE_MINIO_SECRET_KEY:-minioadmin}
      KNOWLEDGE_MINIO_BUCKET: ${KNOWLEDGE_MINIO_BUCKET:-info-agent}
      KNOWLEDGE_CORE_URL: ${KNOWLEDGE_CORE_URL:-http://core-service:8080}
      KNOWLEDGE_CORE_SERVICE_TOKEN: ${KNOWLEDGE_CORE_SERVICE_TOKEN:-local-development-only}
      KNOWLEDGE_INTERNAL_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_SERVICE_TOKEN:-local-development-only}
      KNOWLEDGE_RAG_URL: ${KNOWLEDGE_RAG_URL:-http://rag-service:8000}
      KNOWLEDGE_RAG_TOKEN: ${KNOWLEDGE_RAG_TOKEN:-local-development-only}
      KNOWLEDGE_JWT_SECRET: ${KNOWLEDGE_JWT_SECRET:-}
      KNOWLEDGE_JWT_PUBLIC_KEY: ${KNOWLEDGE_JWT_PUBLIC_KEY:-}
      KNOWLEDGE_JWT_ISSUER: ${KNOWLEDGE_JWT_ISSUER:-info-agent-core}
      KNOWLEDGE_JWT_AUDIENCE: ${KNOWLEDGE_JWT_AUDIENCE:-info-agent-api}
      KNOWLEDGE_JWT_REQUIRED: ${KNOWLEDGE_JWT_REQUIRED:-true}
      KNOWLEDGE_ENCRYPTION_KEY_VERSION: ${KNOWLEDGE_ENCRYPTION_KEY_VERSION:-v1}
      KNOWLEDGE_ENCRYPTION_KEYS: ${KNOWLEDGE_ENCRYPTION_KEYS:-}
      KNOWLEDGE_FEISHU_CLIENT_ID: ${KNOWLEDGE_FEISHU_CLIENT_ID:-}
      KNOWLEDGE_FEISHU_CLIENT_SECRET: ${KNOWLEDGE_FEISHU_CLIENT_SECRET:-}
      KNOWLEDGE_FEISHU_REDIRECT_URI: ${KNOWLEDGE_FEISHU_REDIRECT_URI:-}
      KNOWLEDGE_DESKTOP_OAUTH_RETURN_URI: ${KNOWLEDGE_DESKTOP_OAUTH_RETURN_URI:-infoagent://oauth/callback}
      KNOWLEDGE_FRONTEND_URL: ${KNOWLEDGE_FRONTEND_URL:-http://localhost/profile}
      KNOWLEDGE_COLLECTOR_MODE: ${KNOWLEDGE_COLLECTOR_MODE:-server}
      KNOWLEDGE_WECHAT_COLLECTOR_URL: ${KNOWLEDGE_WECHAT_COLLECTOR_URL:-http://wechat-collector:8091}
      KNOWLEDGE_COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
      core-service:
        condition: service_started
      wechat-collector:
        condition: service_started
    expose:
      - "8090"

  wechat-collector:
    build: ../services/collectors/wechat
    environment:
      COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      KNOWLEDGE_INTERNAL_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_SERVICE_TOKEN:-local-development-only}
      WECHAT_COLLECTOR_PORT: 8091
    expose:
      - "8091"

  agent-migrate:
    build: ../services/agent
    command: ["python", "-m", "app.infrastructure.postgres.migrate", "--bootstrap"]
    environment:
      <<: *agent-environment
      AGENT_MIGRATIONS_DIR: /migrations
    volumes:
      - ../db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-service:
    build: ../services/agent
    environment: *agent-environment
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      knowledge-service:
        condition: service_started
      core-service:
        condition: service_started
    expose:
      - "8080"

  agent-task-worker:
    build: ../services/agent
    command: ["python", "worker_supervisor.py"]
    environment: *agent-environment
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      knowledge-service:
        condition: service_started

  agent-knowledge-worker:
    build: ../services/agent
    command: ["python", "knowledge_worker.py"]
    environment: *agent-environment
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      knowledge-service:
        condition: service_started

  rag-service:
    build: ../services/rag
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_DISPLAY_READ_INDEX: ${ELASTICSEARCH_DISPLAY_READ_INDEX:-rag_chunks_display_read}
      ELASTICSEARCH_DISPLAY_WRITE_INDEX: ${ELASTICSEARCH_DISPLAY_WRITE_INDEX:-rag_chunks_display_write}
      ELASTICSEARCH_PROTECTED_READ_INDEX: ${ELASTICSEARCH_PROTECTED_READ_INDEX:-rag_chunks_protected_read}
      ELASTICSEARCH_PROTECTED_WRITE_INDEX: ${ELASTICSEARCH_PROTECTED_WRITE_INDEX:-rag_chunks_protected_write}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_DATABASE_SCHEMA: ${RAG_DATABASE_SCHEMA:-rag_mvp}
      RAG_TREE_MODE: ${RAG_TREE_MODE:-tree}
      RAG_REDIS_URL: ${RAG_REDIS_URL:-redis://redis:6379/1}
      RAG_REDIS_DATABASE: ${RAG_REDIS_DATABASE:-1}
      RAG_REDIS_INBOUND_STREAM: ${RAG_REDIS_INBOUND_STREAM:-knowledge:ready}
      RAG_REDIS_CONSUMER_GROUP: ${RAG_REDIS_CONSUMER_GROUP:-rag-workers}
      RAG_KNOWLEDGE_BASE_URL: ${RAG_KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      RAG_KNOWLEDGE_API_TOKEN: ${RAG_KNOWLEDGE_API_TOKEN:-local-development-only}
      RAG_AUTHZ_BASE_URL: ${RAG_AUTHZ_BASE_URL:-http://core-service:8080}
      RAG_AUTHZ_API_TOKEN: ${RAG_AUTHZ_API_TOKEN:-local-development-only}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:-minio:9000}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:-minioadmin}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:-minioadmin}
      MINERU_TASK_MAX_WAIT_SECONDS: ${MINERU_TASK_MAX_WAIT_SECONDS:-90}
      MINERU_RESULT_DOWNLOAD_TIMEOUT_SECONDS: ${MINERU_RESULT_DOWNLOAD_TIMEOUT_SECONDS:-300}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-local-development-only}
    expose:
      - "8000"
    depends_on:
      - elasticsearch
      - redis
      - knowledge-service
      - core-service
      - minio

  rag-worker:
    build: ../services/rag
    command: ["python", "worker.py"]
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_DISPLAY_READ_INDEX: ${ELASTICSEARCH_DISPLAY_READ_INDEX:-rag_chunks_display_read}
      ELASTICSEARCH_DISPLAY_WRITE_INDEX: ${ELASTICSEARCH_DISPLAY_WRITE_INDEX:-rag_chunks_display_write}
      ELASTICSEARCH_PROTECTED_READ_INDEX: ${ELASTICSEARCH_PROTECTED_READ_INDEX:-rag_chunks_protected_read}
      ELASTICSEARCH_PROTECTED_WRITE_INDEX: ${ELASTICSEARCH_PROTECTED_WRITE_INDEX:-rag_chunks_protected_write}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      RAG_DATABASE_SCHEMA: ${RAG_DATABASE_SCHEMA:-rag_mvp}
      RAG_TREE_MODE: ${RAG_TREE_MODE:-tree}
      RAG_REDIS_URL: ${RAG_REDIS_URL:-redis://redis:6379/1}
      RAG_REDIS_DATABASE: ${RAG_REDIS_DATABASE:-1}
      RAG_REDIS_INBOUND_STREAM: ${RAG_REDIS_INBOUND_STREAM:-knowledge:ready}
      RAG_REDIS_CONSUMER_GROUP: ${RAG_REDIS_CONSUMER_GROUP:-rag-workers}
      RAG_KNOWLEDGE_BASE_URL: ${RAG_KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      RAG_KNOWLEDGE_API_TOKEN: ${RAG_KNOWLEDGE_API_TOKEN:-local-development-only}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:-minio:9000}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:-minioadmin}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:-minioadmin}
      RAG_MINIO_SOURCE_BUCKET: ${RAG_MINIO_SOURCE_BUCKET:-info-agent}
    depends_on:
      - elasticsearch
      - redis
      - knowledge-service
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-info_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  knowledge-migrate:
    image: postgres:16-alpine
    environment:
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - sh
      - -ec
      - >-
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260905_knowledge_connectors.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260910_private_chat_pipeline.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260911_knowledge_runtime_compatibility.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260912_attachment_content_access.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260913_contacts.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260916_knowledge_ready_pipeline.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260916_rag_memory_tree.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260918_knowledge_rag_status.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260926_rag_mvp_schema.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_rag_mvp_entity_review_requests.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_rag_mvp_phase1_hardening.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_rag_mvp_phase3_fencing.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_knowledge_rag_source_audit.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_knowledge_private_classification.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260927_knowledge_rag_mvp_status.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260925_contact_profiles.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261004_wechat_device_assignments.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261007_wechat_control_flow.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261007_contact_name_core.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261007_knowledge_lifecycle_ready.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261009_tree_rag_v2_schema.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261009_wechat_contact_book.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261010_tree_rag_scan_watermarks.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261011_tree_rag_eval.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261011_tree_rag_search_history_tree_mode.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261012_tree_rag_scan_runs.up.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20261013_tree_rag_review_duration.up.sql
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations/20260905_knowledge_connectors.sql:/migrations/20260905_knowledge_connectors.sql:ro
      - ../db/migrations/20260910_private_chat_pipeline.sql:/migrations/20260910_private_chat_pipeline.sql:ro
      - ../db/migrations/20260911_knowledge_runtime_compatibility.sql:/migrations/20260911_knowledge_runtime_compatibility.sql:ro
      - ../db/migrations/20260912_attachment_content_access.sql:/migrations/20260912_attachment_content_access.sql:ro
      - ../db/migrations/20260913_contacts.sql:/migrations/20260913_contacts.sql:ro
      - ../db/migrations/20260916_knowledge_ready_pipeline.sql:/migrations/20260916_knowledge_ready_pipeline.sql:ro
      - ../db/migrations/20260916_rag_memory_tree.sql:/migrations/20260916_rag_memory_tree.sql:ro
      - ../db/migrations/20260918_knowledge_rag_status.sql:/migrations/20260918_knowledge_rag_status.sql:ro
      - ../db/migrations/20260926_rag_mvp_schema.sql:/migrations/20260926_rag_mvp_schema.sql:ro
      - ../db/migrations/20260927_rag_mvp_entity_review_requests.sql:/migrations/20260927_rag_mvp_entity_review_requests.sql:ro
      - ../db/migrations/20260927_rag_mvp_phase1_hardening.up.sql:/migrations/20260927_rag_mvp_phase1_hardening.up.sql:ro
      - ../db/migrations/20260927_rag_mvp_phase1_hardening.down.sql:/migrations/20260927_rag_mvp_phase1_hardening.down.sql:ro
      - ../db/migrations/20260927_rag_mvp_phase3_fencing.up.sql:/migrations/20260927_rag_mvp_phase3_fencing.up.sql:ro
      - ../db/migrations/20260927_rag_mvp_phase3_fencing.down.sql:/migrations/20260927_rag_mvp_phase3_fencing.down.sql:ro
      - ../db/migrations/20260927_knowledge_rag_source_audit.sql:/migrations/20260927_knowledge_rag_source_audit.sql:ro
      - ../db/migrations/20260927_knowledge_rag_source_audit.down.sql:/migrations/20260927_knowledge_rag_source_audit.down.sql:ro
      - ../db/migrations/20260927_knowledge_private_classification.up.sql:/migrations/20260927_knowledge_private_classification.up.sql:ro
      - ../db/migrations/20260927_knowledge_private_classification.down.sql:/migrations/20260927_knowledge_private_classification.down.sql:ro
      - ../db/migrations/20260927_knowledge_rag_mvp_status.sql:/migrations/20260927_knowledge_rag_mvp_status.sql:ro
      - ../db/migrations/20260925_contact_profiles.sql:/migrations/20260925_contact_profiles.sql:ro
      - ../db/migrations/20261004_wechat_device_assignments.up.sql:/migrations/20261004_wechat_device_assignments.up.sql:ro
      - ../db/migrations/20261004_wechat_device_assignments.down.sql:/migrations/20261004_wechat_device_assignments.down.sql:ro
