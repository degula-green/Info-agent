    restart: "no"

  redis:
    image: redis:7-alpine
    # Refresh sessions and connector credentials are stateful. AOF keeps the
    # latest rotation/lock state across restarts instead of relying only on a
    # periodic RDB snapshot.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - core-service
      - knowledge-service
      - rag-service
      - agent-service

  elasticsearch:
    build:
      context: ./elasticsearch
    image: info-agent-elasticsearch:9.5.2-ik
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8081:8080"

  # Search discovery for web.research. Internal only: the Agent reaches it at
  # http://searxng:8080 and the JSON format is enabled in the mounted settings,
  # because the default HTML endpoint is not machine-readable.
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:18080/}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-development-only}
    volumes:
      - ./searxng:/etc/searxng:rw
    # Bound to loopback only. The host port is 18080 because 8080 is commonly
    # taken; the Agent reaches it at 127.0.0.1:18080, while a container-side
    # caller would use http://searxng:8080. Keep AGENT_SEARXNG_BASE_URL in step
    # with this mapping. Never publish it to the public network.
    ports:
      - "127.0.0.1:18080:8080"

  # Rendering fallback for pages a plain GET cannot read. Chromium stays out of
  # the Agent process: a renderer outage should degrade research, not stop the
  # service.
  crawl4ai:
    image: unclecode/crawl4ai:latest
    environment:
      # Every endpoint of the official image is behind this token, so it must
      # match AGENT_CRAWL4AI_API_TOKEN on the Agent side.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-local-development-only}
      CRAWL4AI_MAX_CONCURRENCY: ${CRAWL4AI_MAX_CONCURRENCY:-2}
    # Chromium needs more than Docker's default 64MB shared memory.
    shm_size: 1g
    ports:
      - "127.0.0.1:11235:11235"

  # Stateful browser for the Agent's form-filling capability. Separate from the
  # renderer because it holds login state and drives typing, not just reads.
  form-browser:
    build: ../services/form-browser
    environment:
      FORM_BROWSER_PORT: 8500
      # Every endpoint is behind this token; it must match
      # AGENT_FORM_BROWSER_TOKEN on the Agent side.
      FORM_BROWSER_API_TOKEN: ${FORM_BROWSER_API_TOKEN:-local-development-only}
      FORM_BROWSER_HEADLESS: ${FORM_BROWSER_HEADLESS:-true}
      # Point this at a Playwright storage-state file to reuse a login.
      FORM_BROWSER_STORAGE_STATE: ${FORM_BROWSER_STORAGE_STATE:-}
    # Chromium needs more than Docker's default 64MB shared memory.
    shm_size: 1g
    # Bound to loopback only, exactly like the renderer sidecar.
    ports:
      - "127.0.0.1:8500:8500"

volumes:
  elasticsearch-data:
  postgres-data:
  redis-data:
  minio-data:
