services:
  web:
    build: ../apps/web
    expose:
      - "80"

  core-service:
    build: ../services/core
    environment:
      CORE_REDIS_DATABASE: ${CORE_REDIS_DATABASE:-1}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://redis:6379/1}
      CORE_REFRESH_ROTATION_GRACE: ${CORE_REFRESH_ROTATION_GRACE:-5s}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      CORE_DATABASE_SCHEMA: ${CORE_DATABASE_SCHEMA:-public}
      CORE_MINIO_ENDPOINT: ${CORE_MINIO_ENDPOINT:-minio:9000}
      CORE_MINIO_ACCESS_KEY: ${CORE_MINIO_ACCESS_KEY:-minioadmin}
      CORE_MINIO_SECRET_KEY: ${CORE_MINIO_SECRET_KEY:-minioadmin}
      CORE_MINIO_BUCKET: ${CORE_MINIO_BUCKET:-info-agent}
      CORE_OPENFGA_URL: ${CORE_OPENFGA_URL:-http://openfga:8080}
      CORE_OPENFGA_STORE_ID: ${CORE_OPENFGA_STORE_ID:-}
      CORE_OPENFGA_MODEL_ID: ${CORE_OPENFGA_MODEL_ID:-}
      CORE_RAG_AUTHZ_TOKEN: ${CORE_RAG_AUTHZ_TOKEN:-local-development-only}
      CORE_KNOWLEDGE_AUTHZ_TOKEN: ${KNOWLEDGE_CORE_SERVICE_TOKEN:-local-development-only}
    depends_on:
      - postgres
      - redis
      - minio
      - openfga
    expose:
      - "8080"

  knowledge-service:
    build: ../services/knowledge
    environment:
      KNOWLEDGE_HTTP_PORT: 8090
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      KNOWLEDGE_DATABASE_SCHEMA: ${KNOWLEDGE_DATABASE_SCHEMA:-knowledge}
      KNOWLEDGE_REDIS_URL: ${KNOWLEDGE_REDIS_URL:-redis://redis:6379/1}
      KNOWLEDGE_REDIS_REQUIRED: ${KNOWLEDGE_REDIS_REQUIRED:-true}
      KNOWLEDGE_REDIS_OUTBOUND_STREAM: ${KNOWLEDGE_REDIS_OUTBOUND_STREAM:-knowledge:ready}
      KNOWLEDGE_MINIO_ENDPOINT: ${KNOWLEDGE_MINIO_ENDPOINT:-minio:9000}
      KNOWLEDGE_MINIO_ACCESS_KEY: ${KNOWLEDGE_MINIO_ACCESS_KEY:-minioadmin}
      KNOWLEDGE_MINIO_SECRET_KEY: ${KNOWLEDGE_MINIO_SECRET_KEY:-minioadmin}
      KNOWLEDGE_MINIO_BUCKET: ${KNOWLEDGE_MINIO_BUCKET:-info-agent}
      KNOWLEDGE_CORE_URL: ${KNOWLEDGE_CORE_URL:-http://core-service:8080}
      KNOWLEDGE_CORE_SERVICE_TOKEN: ${KNOWLEDGE_CORE_SERVICE_TOKEN:-local-development-only}
      KNOWLEDGE_INTERNAL_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_SERVICE_TOKEN:-local-development-only}
      KNOWLEDGE_RAG_URL: ${KNOWLEDGE_RAG_URL:-http://rag-service:8000}
      KNOWLEDGE_RAG_TOKEN: ${KNOWLEDGE_RAG_TOKEN:-local-development-only}
      KNOWLEDGE_JWT_SECRET: ${KNOWLEDGE_JWT_SECRET:-}
      KNOWLEDGE_JWT_PUBLIC_KEY: ${KNOWLEDGE_JWT_PUBLIC_KEY:-}
      KNOWLEDGE_JWT_ISSUER: ${KNOWLEDGE_JWT_ISSUER:-info-agent-core}
      KNOWLEDGE_JWT_AUDIENCE: ${KNOWLEDGE_JWT_AUDIENCE:-info-agent-api}
      KNOWLEDGE_JWT_REQUIRED: ${KNOWLEDGE_JWT_REQUIRED:-true}
      KNOWLEDGE_ENCRYPTION_KEY_VERSION: ${KNOWLEDGE_ENCRYPTION_KEY_VERSION:-v1}
      KNOWLEDGE_ENCRYPTION_KEYS: ${KNOWLEDGE_ENCRYPTION_KEYS:-}
      KNOWLEDGE_FEISHU_CLIENT_ID: ${KNOWLEDGE_FEISHU_CLIENT_ID:-}
      KNOWLEDGE_FEISHU_CLIENT_SECRET: ${KNOWLEDGE_FEISHU_CLIENT_SECRET:-}
      KNOWLEDGE_FEISHU_REDIRECT_URI: ${KNOWLEDGE_FEISHU_REDIRECT_URI:-}
      KNOWLEDGE_FRONTEND_URL: ${KNOWLEDGE_FRONTEND_URL:-http://localhost/profile}
      KNOWLEDGE_WECHAT_COLLECTOR_URL: ${KNOWLEDGE_WECHAT_COLLECTOR_URL:-http://wechat-collector:8091}
      KNOWLEDGE_COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
      core-service:
        condition: service_started
      wechat-collector:
        condition: service_started
    expose:
      - "8090"

  wechat-collector:
    build: ../services/collectors/wechat
    environment:
      COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
      KNOWLEDGE_BASE_URL: ${KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      KNOWLEDGE_INTERNAL_SERVICE_TOKEN: ${KNOWLEDGE_INTERNAL_SERVICE_TOKEN:-local-development-only}
      WECHAT_COLLECTOR_PORT: 8091
    expose:
      - "8091"

  rag-service:
    build: ../services/rag
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_DISPLAY_INDEX: ${ELASTICSEARCH_DISPLAY_INDEX:-knowledge_display_chunks_read}
      ELASTICSEARCH_PROTECTED_INDEX: ${ELASTICSEARCH_PROTECTED_INDEX:-knowledge_protected_chunks_read}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_DATABASE_SCHEMA: ${RAG_DATABASE_SCHEMA:-rag}
      RAG_REDIS_URL: ${RAG_REDIS_URL:-redis://redis:6379/1}
      RAG_REDIS_DATABASE: ${RAG_REDIS_DATABASE:-1}
      RAG_REDIS_INBOUND_STREAM: ${RAG_REDIS_INBOUND_STREAM:-knowledge:ready}
      RAG_REDIS_CONSUMER_GROUP: ${RAG_REDIS_CONSUMER_GROUP:-rag-workers}
      RAG_KNOWLEDGE_BASE_URL: ${RAG_KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      RAG_KNOWLEDGE_API_TOKEN: ${RAG_KNOWLEDGE_API_TOKEN:-local-development-only}
      RAG_AUTHZ_BASE_URL: ${RAG_AUTHZ_BASE_URL:-http://core-service:8080}
      RAG_AUTHZ_API_TOKEN: ${RAG_AUTHZ_API_TOKEN:-local-development-only}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:-minio:9000}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:-minioadmin}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:-minioadmin}
    expose:
      - "8000"
    depends_on:
      - elasticsearch
      - redis
      - knowledge-service
      - core-service
      - minio

  rag-worker:
    build: ../services/rag
    command: ["python", "worker.py"]
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_DISPLAY_INDEX: ${ELASTICSEARCH_DISPLAY_INDEX:-knowledge_display_chunks_read}
      ELASTICSEARCH_PROTECTED_INDEX: ${ELASTICSEARCH_PROTECTED_INDEX:-knowledge_protected_chunks_read}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      RAG_DATABASE_SCHEMA: ${RAG_DATABASE_SCHEMA:-rag}
      RAG_REDIS_URL: ${RAG_REDIS_URL:-redis://redis:6379/1}
      RAG_REDIS_DATABASE: ${RAG_REDIS_DATABASE:-1}
      RAG_REDIS_INBOUND_STREAM: ${RAG_REDIS_INBOUND_STREAM:-knowledge:ready}
      RAG_REDIS_CONSUMER_GROUP: ${RAG_REDIS_CONSUMER_GROUP:-rag-workers}
      RAG_KNOWLEDGE_BASE_URL: ${RAG_KNOWLEDGE_BASE_URL:-http://knowledge-service:8090}
      RAG_KNOWLEDGE_API_TOKEN: ${RAG_KNOWLEDGE_API_TOKEN:-local-development-only}
      RAG_MINIO_ENDPOINT: ${RAG_MINIO_ENDPOINT:-minio:9000}
      RAG_MINIO_ACCESS_KEY: ${RAG_MINIO_ACCESS_KEY:-minioadmin}
      RAG_MINIO_SECRET_KEY: ${RAG_MINIO_SECRET_KEY:-minioadmin}
      RAG_MINIO_SOURCE_BUCKET: ${RAG_MINIO_SOURCE_BUCKET:-info-agent}
    depends_on:
      - elasticsearch
      - redis
      - knowledge-service
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-info_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  knowledge-migrate:
    image: postgres:16-alpine
    environment:
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/info_agent}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - sh
      - -ec
      - >-
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260905_knowledge_connectors.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260910_private_chat_pipeline.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260911_knowledge_runtime_compatibility.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260912_attachment_content_access.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260913_contacts.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260916_knowledge_ready_pipeline.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260916_rag_memory_tree.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260918_knowledge_rag_status.sql &&
        psql --dbname="$${KNOWLEDGE_DATABASE_URL}" --set=ON_ERROR_STOP=1 --file=/migrations/20260925_contact_profiles.sql
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db/migrations/20260905_knowledge_connectors.sql:/migrations/20260905_knowledge_connectors.sql:ro
      - ../db/migrations/20260910_private_chat_pipeline.sql:/migrations/20260910_private_chat_pipeline.sql:ro
      - ../db/migrations/20260911_knowledge_runtime_compatibility.sql:/migrations/20260911_knowledge_runtime_compatibility.sql:ro
      - ../db/migrations/20260912_attachment_content_access.sql:/migrations/20260912_attachment_content_access.sql:ro
      - ../db/migrations/20260913_contacts.sql:/migrations/20260913_contacts.sql:ro
      - ../db/migrations/20260916_knowledge_ready_pipeline.sql:/migrations/20260916_knowledge_ready_pipeline.sql:ro
      - ../db/migrations/20260916_rag_memory_tree.sql:/migrations/20260916_rag_memory_tree.sql:ro
      - ../db/migrations/20260918_knowledge_rag_status.sql:/migrations/20260918_knowledge_rag_status.sql:ro
      - ../db/migrations/20260925_contact_profiles.sql:/migrations/20260925_contact_profiles.sql:ro
    restart: "no"

  redis:
    image: redis:7-alpine
    # Refresh sessions and connector credentials are stateful. AOF keeps the
    # latest rotation/lock state across restarts instead of relying only on a
    # periodic RDB snapshot.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - core-service
      - knowledge-service
      - rag-service

  elasticsearch:
    build:
      context: ./elasticsearch
    image: info-agent-elasticsearch:9.5.2-ik
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8081:8080"

volumes:
  elasticsearch-data:
  postgres-data:
  redis-data:
  minio-data:
