# SearXNG for web.research.
#
# Two settings actually matter here:
#   * search.formats must include json -- the Agent calls /search?format=json,
#     and SearXNG serves HTML by default, which the client refuses.
#   * server.limiter stays off because the instance is internal and reachable
#     only from the compose network; the bot limiter would reject the Agent.
use_default_settings: true

general:
  instance_name: "info-agent-search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "local-development-only"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
